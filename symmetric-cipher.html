<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Symmetric Cipher</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #282838;
    --accent: #7aa2f7;
    --text: #e0e0f0;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  @media (max-width: 768px) {
    body { padding: 16px; }
    .card { padding: 24px 18px; }
  }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .card { padding: 20px 14px; }
    h1 { font-size: 1.2rem; }
    button { padding: 13px 12px; }
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 20px;
    text-align: center;
    color: var(--accent);
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3a3a4d;
    background: #1a1a26;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #1a1a26;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  .result {
    margin-top: 22px;
    background: #1a1a26;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.95rem;
  }
  .result p { margin: 6px 0; word-break: break-word; }
  .result span { color: var(--muted); }
  .result strong { color: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <h1>Symmetric Cipher</h1>

  <label for="phrase">Enter a word or phrase</label>
  <input type="text" id="phrase" placeholder="Hello World">

  <label for="key">Enter the encryption key</label>
  <input type="number" id="key" value="3">

  <button onclick="run()">Encrypt / Decrypt</button>

  <div class="result" id="result" style="display:none;">
    <p><span>Encrypted:</span> <strong id="encryptedOut"></strong></p>
    <p><span>Decrypted:</span> <strong id="decryptedOut"></strong></p>
  </div>
</div>

  <a class="btn btn-asymmetric" href="asymmetric-cipher.html">
    Asymmetric Cipher
  </a>

<script>
  function isLetter(ch) {
    return /[a-zA-Z]/.test(ch);
  }

  function isWhitespace(ch) {
    return /\s/.test(ch);
  }

  function encrypt(text, key) {
    let encrypted = "";
    for (const ch of text) {
      if (isLetter(ch)) {
        const base = (ch === ch.toUpperCase()) ? 'A'.charCodeAt(0) : 'a'.charCodeAt(0);
        const shifted = (((ch.charCodeAt(0) - base + key) % 26) + 26) % 26;
        encrypted += String.fromCharCode(base + shifted);
      } else if (!isWhitespace(ch)) {
        encrypted += ch;
      }
    }
    return encrypted;
  }

  function decrypt(text, key) {
    let decrypted = "";
    for (const ch of text) {
      if (isLetter(ch)) {
        const base = (ch === ch.toUpperCase()) ? 'A'.charCodeAt(0) : 'a'.charCodeAt(0);
        const shifted = (((ch.charCodeAt(0) - base - key) % 26) + 26) % 26;
        decrypted += String.fromCharCode(base + shifted);
      } else if (!isWhitespace(ch)) {
        decrypted += ch;
      }
    }
    return decrypted;
  }

  function run() {
    const phrase = document.getElementById('phrase').value;
    const key = parseInt(document.getElementById('key').value, 10) || 0;

    const encrypted = encrypt(phrase, key);
    const decrypted = decrypt(encrypted, key);

    document.getElementById('encryptedOut').textContent = encrypted;
    document.getElementById('decryptedOut').textContent = decrypted;
    document.getElementById('result').style.display = 'block';
  }
</script>

</body>
</html>
