<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cipher Toolkit</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #282838;
    --accent: #7aa2f7;
    --accent2: #bb9af7;
    --text: #e0e0f0;
    --muted: #9a9ab0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 12px;
    padding: 36px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px;
    color: var(--accent);
  }
  p.subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }
  .btn-symmetric {
    background: var(--accent);
    color: #1a1a26;
  }
  .btn-asymmetric {
    background: var(--accent2);
    color: #1a1a26;
  }
  .btn small {
    display: block;
    font-weight: 400;
    font-size: 0.75rem;
    margin-top: 4px;
    opacity: 0.75;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Cipher Toolkit</h1>
  <p class="subtitle">Choose a cipher to open</p>

  <a class="btn btn-symmetric" href="symmetric-cipher.html">
    Symmetric Cipher
    <small>Caesar shift, encrypt &amp; decrypt directly</small>
  </a>

  <a class="btn btn-asymmetric" href="asymmetric-cipher.html">
    Asymmetric Cipher
    <small>Encrypt, then step-by-step forward decryption</small>
  </a>
</div>

</body>
</html>
